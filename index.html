<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glyde">
  <meta name="theme-color" content="#5b3fd0">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preload" href="fonts/lilita-one.woff2" as="font" type="font/woff2" crossorigin>
  <title>Glyde</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="bg"><i></i><i></i><i></i><i></i><i></i></div>
    <canvas id="gl"></canvas>

    <div id="hud" class="hidden">
      <div id="hud-top">
        <div class="col left">
          <button class="ibtn orange" id="btn-settings" aria-label="Settings"></button>
          <button class="ibtn purple" id="btn-daily" aria-label="Daily rewards"><span class="dot hidden" id="dot-daily">!</span></button>
          <div class="chip" id="daily-timer">--</div>
        </div>
        <div class="mid">
          <div class="icons">
            <button class="ibtn purple" id="btn-modes" aria-label="Game modes"></button>
            <button class="ibtn purple" id="btn-themes" aria-label="Themes"><span class="dot hidden" id="dot-themes">!</span></button>
            <button class="ibtn purple" id="btn-ach" aria-label="Achievements"><span class="dot hidden" id="dot-ach">!</span></button>
            <button class="ibtn purple" id="btn-balls" aria-label="Balls"><span class="dot hidden" id="dot-balls">!</span></button>
          </div>
          <div class="title-row">
            <div id="level-title">LEVEL 1</div>
            <div class="coins" id="coins"><svg class="coin-ico" viewBox="0 0 24 24"><use href="#i-coin"/></svg><b id="coin-count">0</b></div>
          </div>
          <div id="stage"></div>
        </div>
      </div>

      <div id="hand" class="hidden"><div class="touch"></div><span>SWIPE!</span></div>

      <div id="bottombar">
        <button class="rbtn" id="btn-undo" aria-label="Undo"><span class="ico"></span><em>UNDO</em></button>
        <div id="status" class="pill"><span id="status-label">MOVES</span><b id="status-val">0</b></div>
        <button class="rbtn" id="btn-hint" aria-label="Hint"><span class="ico"></span><em>HINT</em><small><svg viewBox="0 0 24 24"><use href="#i-coin"/></svg>25</small></button>
        <button class="rbtn" id="btn-restart" aria-label="Restart"><span class="ico"></span><em>RESTART</em></button>
      </div>
    </div>

    <div id="toast"></div>
    <div id="screens"></div>
    <div id="flash"></div>

    <div id="loading">
      <div class="logo"><span>G</span><span>L</span><span>Y</span><span>D</span><span>E</span></div>
      <div class="tag">ROLL. PAINT. CONQUER.</div>
      <div class="loadbar"><i></i></div>
      <div class="nogl hidden" id="nogl">This device can't run WebGL, which Glyde needs for its 3D graphics.</div>
    </div>
  </div>

  <!-- icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#f4b400"/><circle cx="12" cy="12" r="10.5" fill="none" stroke="#fff0a8" stroke-width="1.6"/><circle cx="12" cy="12" r="7" fill="#ffd633" stroke="#e29a00" stroke-width="1.4"/><path d="M12 7.5v9M9.5 9.7c0-1 1.1-1.6 2.5-1.6s2.5.6 2.5 1.6-1 1.4-2.5 1.8-2.5.8-2.5 1.8 1.1 1.6 2.5 1.6 2.5-.6 2.5-1.6" fill="none" stroke="#c98200" stroke-width="1.3" stroke-linecap="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M10.3 2.5h3.4l.5 2.5c.6.2 1.1.5 1.6.9l2.4-.9 1.7 3-1.9 1.7c.1.6.1 1.2 0 1.8l1.9 1.7-1.7 3-2.4-.9c-.5.4-1 .7-1.6.9l-.5 2.5h-3.4l-.5-2.5c-.6-.2-1.1-.5-1.6-.9l-2.4.9-1.7-3 1.9-1.7a6 6 0 0 1 0-1.8L4.1 8.5l1.7-3 2.4.9c.5-.4 1-.7 1.6-.9zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" transform="translate(0 .5)"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="#fff"/><path d="M3 8a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v2H3z" fill="#ff5a7a"/><rect x="7" y="2.5" width="2.4" height="5" rx="1.2" fill="#fff"/><rect x="14.6" y="2.5" width="2.4" height="5" rx="1.2" fill="#fff"/><g fill="#9b86f5"><rect x="6" y="12" width="3" height="2.4" rx=".6"/><rect x="10.5" y="12" width="3" height="2.4" rx=".6"/><rect x="15" y="12" width="3" height="2.4" rx=".6"/><rect x="6" y="16" width="3" height="2.4" rx=".6"/><rect x="10.5" y="16" width="3" height="2.4" rx=".6"/></g></symbol>
      <symbol id="i-modes" viewBox="0 0 24 24"><path fill="#fff" d="M7 9h10a5 5 0 0 1 4.8 6.4l-.6 2.2a2.4 2.4 0 0 1-4 1l-2-2H8.8l-2 2a2.4 2.4 0 0 1-4-1l-.6-2.2A5 5 0 0 1 7 9z"/><path d="M8.2 11.3v4M6.2 13.3h4" stroke="#7c5cf0" stroke-width="1.8" stroke-linecap="round"/><circle cx="15.5" cy="12.2" r="1.1" fill="#ff5a7a"/><circle cx="18" cy="14.4" r="1.1" fill="#2fd04b"/></symbol>
      <symbol id="i-brush" viewBox="0 0 24 24"><path fill="#ffb02e" d="M17.7 2.6l3.7 3.7a1.3 1.3 0 0 1 0 1.8L14 15.4l-5.5-5.5 7.4-7.3a1.3 1.3 0 0 1 1.8 0z"/><path fill="#fff" d="M8 10.8l5.2 5.2c-.2 2.6-2 4.4-5.4 4.9-2 .3-3.9.2-5.3-.2 1.2-.9 1.5-2.2 1.6-3.3.2-3 2.3-5.2 4-6.6z"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path fill="#ffd633" d="M6.5 3h11v6a5.5 5.5 0 0 1-11 0z"/><path d="M6.5 5H3.5v1.5a3.5 3.5 0 0 0 3.4 3.5M17.5 5h3v1.5a3.5 3.5 0 0 1-3.4 3.5" fill="none" stroke="#ffd633" stroke-width="1.8"/><rect x="10.6" y="13.5" width="2.8" height="4" fill="#e8a800"/><rect x="7.5" y="17" width="9" height="3.6" rx="1.3" fill="#ffd633"/><path d="M12 5.2l1 2 2.2.3-1.6 1.5.4 2.2-2-1-2 1 .4-2.2L8.8 7.5 11 7.2z" fill="#fff6c8"/></symbol>
      <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#ffc21f"/><circle cx="12" cy="12" r="9.5" fill="url(#bg1)"/><ellipse cx="8.8" cy="8.2" rx="3.2" ry="2" fill="#fff" opacity=".55" transform="rotate(-35 8.8 8.2)"/></symbol>
      <radialGradient id="bg1" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff2a8" stop-opacity=".9"/><stop offset=".6" stop-color="#ffc21f" stop-opacity="0"/><stop offset="1" stop-color="#a86a00" stop-opacity=".55"/></radialGradient>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7H15a5 5 0 0 1 0 10H8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 3.5L7.5 7 12 10.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5a6.5 6.5 0 0 0-3.6 11.9c.5.4.8.9.8 1.5V17h5.6v-1.1c0-.6.3-1.1.8-1.5A6.5 6.5 0 0 0 12 2.5z"/><rect x="9.2" y="18.2" width="5.6" height="2" rx="1" fill="currentColor"/><rect x="10.2" y="21" width="3.6" height="1.5" rx=".75" fill="currentColor"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.2-5.1" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 3.5v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.4l2.9 6.1 6.7.8-4.9 4.6 1.3 6.6L12 17.3l-6 3.2 1.3-6.6L2.4 9.3l6.7-.8z" fill="currentColor"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="11" rx="2.6" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.5 4.5L7 12l8.5 7.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-moves" viewBox="0 0 24 24"><path d="M12 2.5v19M2.5 12h19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M12 2l-3.4 3.6h6.8zM12 22l-3.4-3.6h6.8zM2 12l3.6-3.4v6.8zM22 12l-3.6-3.4v6.8z" fill="currentColor"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M12 8.5V13l3 2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M4 5.5L7 3M20 5.5L17 3" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-portal" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="9.5" fill="none" stroke="currentColor" stroke-width="2.6"/><ellipse cx="12" cy="12" rx="3.6" ry="5" fill="currentColor"/></symbol>
      <symbol id="i-seal" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3" fill="currentColor"/><path d="M12 6l-2 4 3 2-2 5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/></symbol>
      <symbol id="i-sticky" viewBox="0 0 24 24"><path d="M5 15c0-3.2 3-4 4-6 .9-1.7 2-3.5 4-3.5 3.2 0 5 3 5 6.5 0 4-2.5 6-6.5 6S5 19 5 15z" fill="currentColor"/><circle cx="9" cy="13" r="1.4" fill="#fff" opacity=".6"/></symbol>
      <symbol id="i-chest" viewBox="0 0 24 24"><path d="M3 10a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v1H3z" fill="#c9792e"/><rect x="3" y="11" width="18" height="9" rx="1.8" fill="#a85f1c"/><rect x="10" y="10" width="4" height="5.5" rx="1" fill="#ffd633"/><path d="M3 11h18" stroke="#ffd633" stroke-width="1.6"/></symbol>
      <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3.5" y="9.5" width="17" height="11" rx="2" fill="currentColor"/><rect x="2.5" y="6.5" width="19" height="4.5" rx="1.6" fill="currentColor"/><path d="M12 6.5v14" stroke="#fff" stroke-width="2.4" opacity=".85"/><path d="M12 6.5C9 6.5 7 5.2 7 3.8S9.6 2.6 12 6.5c2.4-3.9 5-3.1 5-1.7s-2 1.7-5 1.7z" fill="#fff" opacity=".9"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5v14l-4.500-4.500H4z" fill="currentColor"/><path d="M15.500 8.500a5 5 0 0 1 0 7M18 6a8.500 8.500 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linejoin="round"/><circle cx="6.500" cy="18" r="3" fill="currentColor"/><circle cx="16.500" cy="16" r="3" fill="currentColor"/></symbol>
      <symbol id="i-vibe" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="2.200" fill="currentColor"/><path d="M4 8v8M20 8v8M1.500 10v4M22.500 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-gfx" viewBox="0 0 24 24"><path d="M12 2.500l8.500 4.800v9.400L12 21.500l-8.500-4.800V7.300z" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round"/><path d="M3.500 7.300L12 12l8.500-4.700M12 12v9.500" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round"/></symbol>
      <symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM16 5v14" fill="currentColor" stroke="currentColor" stroke-width="2.400" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.500 11.500L12 4l8.500 7.500V20h-5.500v-5.500h-6V20H3.500z" fill="currentColor" stroke="currentColor" stroke-width="1.600" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <script type="module" src="js/main.js"></script>
</body>
</html>
